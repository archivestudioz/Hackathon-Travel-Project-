<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#F4F1EC" />
  <title>Roam — travel guides you listen to</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- One persistent map. It is never replaced, only re-framed. -->
  <div id="map" aria-hidden="true"></div>

  <header class="topbar">
    <button id="city-btn" class="pill" aria-label="Change city">
      <span id="city-flag">🗽</span><span id="city-name">New York</span>
    </button>
    <span class="grow"></span>
    <button id="recenter-btn" class="pill icon-only" aria-label="Recenter map">◎</button>
    <button id="lang-btn" class="pill icon-only" aria-label="Change language">🇬🇧</button>
  </header>

  <!-- One bottom sheet, three states. There is no navigation, so there is
       nowhere to get lost. -->
  <main class="sheet" id="sheet" data-state="explore">
    <div class="grabber" aria-hidden="true"></div>

    <!-- ─────────────── state 0 · onboarding ───────────────
         Three taps. Everything after this is filtered through the answers, so
         two travelers standing on the same corner get different routes. -->
    <section data-view="onboard" hidden>
      <p class="onboard-q" data-i18n="whatDoYouLike">What are you into?</p>
      <div class="chips" id="interest-chips"></div>
      <p class="onboard-q" data-i18n="howLocal">How far off the postcard?</p>
      <div class="segmented wide" id="crowd-toggle" role="group"></div>
      <p class="onboard-q" data-i18n="yourPace">Your pace?</p>
      <div class="segmented wide" id="pace-toggle" role="group"></div>
      <div class="sheet-actions">
        <button class="ghost" id="a11y-toggle" aria-pressed="false" title="Step-free">♿</button>
        <button class="primary" id="save-prefs" data-i18n="done">Done</button>
      </div>
    </section>

    <!-- ─────────────── state 1 · explore ─────────────── -->
    <section data-view="explore" hidden>
      <div class="chips" id="chips" role="tablist"></div>
      <div class="list" id="result-list"></div>
      <div class="sheet-actions">
        <div class="segmented" id="mode-toggle" role="group" aria-label="Travel mode"></div>
        <button class="primary" id="start-route">🎧 <span data-i18n="startRoute">Start my route</span></button>
      </div>
      <!-- The human is the upgrade, not the dependency. -->
      <button class="linkish" id="find-guide">🧭 <span data-i18n="orGuide">or meet a local guide</span></button>
    </section>

    <!-- ─────────────── state 2 · matched ─────────────── -->
    <section data-view="matched" hidden>
      <div class="guide-card" id="guide-card"></div>
      <div class="sheet-actions">
        <button class="ghost" id="cancel-ride">✕</button>
        <button class="primary" id="start-tour"><span data-i18n="startTour">Start</span></button>
      </div>
    </section>

    <!-- ─────────────── state 3 · tour ─────────────── -->
    <section data-view="tour" hidden>
      <div class="tour-head" id="tour-head"></div>
      <div class="list" id="stop-list"></div>
      <div class="sheet-actions">
        <button class="ghost" id="end-tour"><span data-i18n="endTour">End tour</span></button>
      </div>
    </section>
  </main>

  <!-- Audio is the interface: a traveler is walking with their hands full and
       their eyes on the street. -->
  <audio id="narration" preload="none"></audio>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
